---
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Git
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]

  # Shell
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--enable=require-double-brackets, --enable=add-default-case]

  # Local hooks
  - repo: local
    hooks:
      - id: bash-syntax
        name: Check Bash syntax
        entry: bash -n
        language: system
        types: [shell]
      - id: positional-params
        name: Check positional parameters are assigned to locals
        entry: python scripts/check_positional_params.py
        language: python
        types: [shell]
      - id: shell-header
        name: Check shell script header
        entry: python scripts/check_shell_header.py
        language: python
        types: [shell]
      - id: markdown-links
        name: Check relative Markdown links
        entry: python scripts/check_md_links.py
        language: python
        types: [markdown]
      - id: skill-spec
        name: Check SKILL.md against the Agent Skills spec
        entry: python scripts/check_skill_spec.py
        language: python
        additional_dependencies: [skills-ref==0.1.1]
        files: ^(skills|plugins/claude/token-effort/skills)/[^/]+/SKILL\.md$
      - id: plugins
        name: Validate the marketplace, core plugin and overhaul mods
        entry: python scripts/check_plugins.py
        language: python
        files: ^(\.claude-plugin/|plugins/claude/|skills/|config/|(hooks|agents|commands|bin|output-styles)/|(settings|\.mcp|\.lsp)\.json$|package(-lock)?\.json$)
        pass_filenames: false
      - id: core-plugin-scripts
        name: Test the core plugin scripts
        entry: node --test plugins/claude/token-effort/scripts/tests/*.test.js
        language: system
        files: ^(plugins/claude/token-effort/(scripts|skills/[^/]+/scripts)/|skills/disclose-ai-content/SKILL\.md$)
        pass_filenames: false
      - id: commit-msg-format
        name: Check commit message format
        entry: '\A(feat|fix|docs|chore): \S'
        language: pygrep
        args: [--multiline, --negate]
        stages: [commit-msg]
