---
name: Continuous Integration

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  checks:
    name: ✅ Checks
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Checkout repository
        uses: actions/checkout@v7
      - name: 🛠️ Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: 🧰 Set up dev environment
        run: ./setup_dev_env.sh --skip-checks
      - name: ✅ Run checks
        run: ./run_checks.sh

  sonarqube:
    name: 🔍 SonarQube Scan
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - name: ⤵️ Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 📡 Run scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
